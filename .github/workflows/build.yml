name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore chessdroid.sln

      - name: Build
        run: dotnet build chessdroid.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ChessDroid.Tests/ChessDroid.Tests.csproj --configuration Release --no-build
